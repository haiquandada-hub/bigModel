# Claude PR 自动审查与合并工作流
#
# 功能：
# 1. PR 提交时自动触发 Claude 代码审查
# 2. Claude 输出结构化的审查结果
# 3. 根据审查结果自动合并或请求修改
#
# 重要说明：
# - Claude Code Action 本身无法直接批准/合并 PR（安全限制）
# - 本方案使用 Claude 的结构化输出 + GitHub CLI 实现自动化
#
# 使用前准备：
# 1. 在仓库 Settings → Secrets 中添加 ANTHROPIC_API_KEY
# 2. 确保 GITHUB_TOKEN 有 pull-requests: write 权限

name: Claude PR Auto Review & Merge

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      force_action:
        description: 'Force action: approve, reject, or skip'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - approve
          - reject
          - skip

# 并发控制：同一 PR 只运行一个审查任务
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ==================== Claude 代码审查 ====================
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      approved: ${{ steps.parse.outputs.approved }}
      summary: ${{ steps.parse.outputs.summary }}
      issues: ${{ steps.parse.outputs.issues }}
      confidence: ${{ steps.parse.outputs.confidence }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR Diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          echo "diff_file=pr_diff.txt" >> $GITHUB_OUTPUT

      - name: Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是一位资深的代码审查专家。请审查以下 Pull Request。

            ## PR 信息
            - **仓库**: ${{ github.repository }}
            - **PR 编号**: #${{ github.event.pull_request.number }}
            - **标题**: ${{ github.event.pull_request.title }}
            - **作者**: ${{ github.event.pull_request.user.login }}
            - **目标分支**: ${{ github.event.pull_request.base.ref }}
            - **源分支**: ${{ github.event.pull_request.head.ref }}

            ## 审查要求

            请从以下维度进行审查：

            ### 1. 代码质量 (权重: 30%)
            - 代码结构和组织
            - 命名规范
            - 可读性和可维护性
            - 代码重复

            ### 2. 安全性 (权重: 30%) - 一票否决
            - SQL 注入
            - XSS 跨站脚本
            - CSRF 跨站请求伪造
            - 认证和授权问题
            - 敏感信息泄露
            - 不安全的依赖

            ### 3. 性能 (权重: 20%)
            - 算法效率
            - 数据库查询优化
            - 内存使用
            - 潜在的性能瓶颈

            ### 4. 最佳实践 (权重: 20%)
            - 错误处理
            - 日志记录
            - 测试覆盖
            - 文档完整性

            ## 输出格式

            使用 structured_output 工具输出以下 JSON 格式：

            ```json
            {
              "approved": boolean,
              "confidence": "high" | "medium" | "low",
              "summary": "一句话总结审查结果",
              "issues": ["具体问题1", "具体问题2"],
              "suggestions": ["改进建议1", "改进建议2"],
              "security_concerns": ["安全问题1"],
              "scores": {
                "code_quality": 0-100,
                "security": 0-100,
                "performance": 0-100,
                "best_practices": 0-100
              }
            }
            ```

            ## 判定规则

            **必须设置 `approved: false` 的情况：**
            - 发现任何安全漏洞
            - 安全评分 < 70
            - 总体评分 < 60

            **可以设置 `approved: true` 的情况：**
            - 无安全问题
            - 仅有小的代码风格或建议性问题
            - 所有评分 >= 70

            请先查看 PR 的 diff，然后给出你的审查意见。
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --output-schema '{
              "type": "object",
              "properties": {
                "approved": {"type": "boolean"},
                "confidence": {"type": "string", "enum": ["high", "medium", "low"]},
                "summary": {"type": "string"},
                "issues": {"type": "array", "items": {"type": "string"}},
                "suggestions": {"type": "array", "items": {"type": "string"}},
                "security_concerns": {"type": "array", "items": {"type": "string"}},
                "scores": {
                  "type": "object",
                  "properties": {
                    "code_quality": {"type": "number"},
                    "security": {"type": "number"},
                    "performance": {"type": "number"},
                    "best_practices": {"type": "number"}
                  }
                }
              },
              "required": ["approved", "confidence", "summary"]
            }'
          track_progress: true
          use_sticky_comment: true
          display_report: true

      - name: Parse Review Result
        id: parse
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          echo "=== Claude Review Result ==="

          if [ -z "$STRUCTURED_OUTPUT" ] || [ "$STRUCTURED_OUTPUT" = "null" ]; then
            echo "Warning: No structured output received"
            echo "approved=unknown" >> $GITHUB_OUTPUT
            echo "summary=No structured output received from Claude" >> $GITHUB_OUTPUT
            echo "confidence=low" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 解析 JSON 输出
          APPROVED=$(echo "$STRUCTURED_OUTPUT" | jq -r '.approved // "unknown"')
          CONFIDENCE=$(echo "$STRUCTURED_OUTPUT" | jq -r '.confidence // "low"')
          SUMMARY=$(echo "$STRUCTURED_OUTPUT" | jq -r '.summary // "No summary provided"')
          ISSUES=$(echo "$STRUCTURED_OUTPUT" | jq -r '.issues // [] | join("\n- ")')
          SUGGESTIONS=$(echo "$STRUCTURED_OUTPUT" | jq -r '.suggestions // [] | join("\n- ")')
          SECURITY=$(echo "$STRUCTURED_OUTPUT" | jq -r '.security_concerns // [] | join("\n- ")')

          # 输出到 GitHub Actions
          echo "approved=$APPROVED" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "issues<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 输出到 Step Summary
          echo "## 🤖 Claude Code Review Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Approved** | $APPROVED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Confidence** | $CONFIDENCE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Summary** | $SUMMARY |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$ISSUES" ] && [ "$ISSUES" != "" ]; then
            echo "### ❌ Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "- $ISSUES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$SUGGESTIONS" ] && [ "$SUGGESTIONS" != "" ]; then
            echo "### 💡 Suggestions" >> $GITHUB_STEP_SUMMARY
            echo "- $SUGGESTIONS" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Review completed: approved=$APPROVED, confidence=$CONFIDENCE"

  # ==================== 处理审查结果 ====================
  handle-result:
    needs: claude-review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 不处理草稿 PR
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine Action
        id: action
        env:
          APPROVED: ${{ needs.claude-review.outputs.approved }}
          FORCE_ACTION: ${{ inputs.force_action }}
        run: |
          # 检查是否强制执行
          if [ "$FORCE_ACTION" = "approve" ]; then
            echo "action=approve" >> $GITHUB_OUTPUT
            echo "reason=Force approved by manual trigger" >> $GITHUB_OUTPUT
          elif [ "$FORCE_ACTION" = "reject" ]; then
            echo "action=reject" >> $GITHUB_OUTPUT
            echo "reason=Force rejected by manual trigger" >> $GITHUB_OUTPUT
          elif [ "$FORCE_ACTION" = "skip" ]; then
            echo "action=skip" >> $GITHUB_OUTPUT
            echo "reason=Skipped by manual trigger" >> $GITHUB_OUTPUT
          # 正常流程
          elif [ "$APPROVED" = "true" ]; then
            echo "action=approve" >> $GITHUB_OUTPUT
            echo "reason=Claude approved this PR" >> $GITHUB_OUTPUT
          elif [ "$APPROVED" = "false" ]; then
            echo "action=reject" >> $GITHUB_OUTPUT
            echo "reason=Claude found issues with this PR" >> $GITHUB_OUTPUT
          else
            echo "action=manual" >> $GITHUB_OUTPUT
            echo "reason=Claude review was inconclusive" >> $GITHUB_OUTPUT
          fi

      # ==================== 通过：合并 PR ====================
      - name: Approve and Merge PR
        if: steps.action.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ needs.claude-review.outputs.summary }}
        run: |
          echo "✅ ${{ steps.action.outputs.reason }}"

          # 添加批准评论
          gh pr comment $PR_NUMBER --body "## ✅ Claude Code Review - Approved

          This PR has been reviewed and approved by Claude AI.

          | Review Item | Result |
          |-------------|--------|
          | **Status** | ✅ Approved |
          | **Summary** | $SUMMARY |
          | **Reviewed at** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          ---

          🤖 *This is an automated review by Claude AI. For production use, consider adding human review gates.*

          Proceeding to merge this PR..."

          # 等待其他检查完成（可选，根据需要调整）
          echo "Waiting for other checks to complete..."
          sleep 5

          # 检查是否可以合并
          MERGEABLE=$(gh pr view $PR_NUMBER --json mergeable --jq '.mergeable')

          if [ "$MERGEABLE" = "MERGEABLE" ]; then
            # 合并 PR（使用 squash 模式）
            gh pr merge $PR_NUMBER --squash --delete-branch --subject "Merge PR #$PR_NUMBER: ${{ github.event.pull_request.title }}"

            echo "### ✅ PR Merged Successfully" >> $GITHUB_STEP_SUMMARY
            echo "PR #$PR_NUMBER has been merged." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Cannot Merge" >> $GITHUB_STEP_SUMMARY
            echo "PR is not in a mergeable state. Status: $MERGEABLE" >> $GITHUB_STEP_SUMMARY

            gh pr comment $PR_NUMBER --body "⚠️ **Cannot auto-merge**: PR is not in a mergeable state (conflicts or failing checks). Please resolve and merge manually."
          fi

      # ==================== 不通过：请求修改 ====================
      - name: Request Changes
        if: steps.action.outputs.action == 'reject'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ needs.claude-review.outputs.summary }}
          ISSUES: ${{ needs.claude-review.outputs.issues }}
        run: |
          echo "❌ ${{ steps.action.outputs.reason }}"

          # 格式化问题列表
          ISSUES_MD=""
          if [ -n "$ISSUES" ]; then
            ISSUES_MD=$(echo "$ISSUES" | sed 's/^/- /' | sed 's/$/<br>/')
          fi

          # 请求修改
          gh pr review $PR_NUMBER --request-changes --body "## ❌ Claude Code Review - Changes Required

          Claude AI has reviewed this PR and found issues that need to be addressed.

          | Review Item | Result |
          |-------------|--------|
          | **Status** | ❌ Changes Requested |
          | **Summary** | $SUMMARY |
          | **Reviewed at** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          ### Issues to Address

          $ISSUES_MD

          ---

          Please address these issues and update your PR. The review will be triggered automatically on your next commit."

          echo "### ❌ Changes Requested" >> $GITHUB_STEP_SUMMARY
          echo "PR #$PR_NUMBER requires changes." >> $GITHUB_STEP_SUMMARY

      # ==================== 需要人工审查 ====================
      - name: Request Manual Review
        if: steps.action.outputs.action == 'manual'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "⚠️ Claude review was inconclusive, requesting manual review"

          gh pr comment $PR_NUMBER --body "## ⚠️ Claude Code Review - Manual Review Required

          Claude's automated review was inconclusive. A human reviewer should examine this PR.

          | Review Item | Result |
          |-------------|--------|
          | **Status** | ⚠️ Needs Manual Review |
          | **Reason** | ${{ steps.action.outputs.reason }} |
          | **Reviewed at** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          ---

          Please wait for a human reviewer to approve this PR."

          # 添加标签
          gh pr edit $PR_NUMBER --add-label "needs-human-review" || true

          echo "### ⚠️ Manual Review Requested" >> $GITHUB_STEP_SUMMARY

      # ==================== 跳过 ====================
      - name: Skip
        if: steps.action.outputs.action == 'skip'
        run: |
          echo "⏭️ Skipped by manual trigger"
          echo "### ⏭️ Skipped" >> $GITHUB_STEP_SUMMARY
