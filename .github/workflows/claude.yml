name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Run GLM-5 on Issue
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
        env:
          ANTHROPIC_BASE_URL: "https://api.z.ai/api/anthropic"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZHIPU_API_KEY }}
          ANTHROPIC_MODEL: "glm-5"
          # 思考模式通过环境变量传递（Node.js SDK 支持顶层参数）
          ENABLE_THINKING: "true"
        with:
          # 将 Issue 的标题和正文作为提示词的一部分
          prompt: |
            你是一个 GitHub Issue 助手，使用 GLM-5 模型。
            请根据以下 Issue 内容，提供专业、有帮助的回复。

            ## Issue 标题
            ${{ github.event.issue.title }}

            ## Issue 正文
            ${{ github.event.issue.body }}

            请用中文回答。如果 Issue 需要代码示例，请提供清晰、可运行的代码。
            如果问题不明确，可以礼貌地请求更多信息。
          # 传递 GitHub Token 以便发布评论
          github_token: ${{ secrets.ZHIPU_GITHUB_TOKEN }}
          # 直接发布为 Issue 评论
          post_to_issue: true
          # 限制最大交互轮次（防止死循环）
          claude_args: "--max-turns 3"
      #- name: Run Claude Code
      #  id: claude
      #  uses: anthropics/claude-code-action@v1
      #  with:
      #    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
